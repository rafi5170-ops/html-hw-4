<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="container">
    <h2 class="title">User Registration</h2>

    <form class="form-box">
      <label>Full Name:
        <input type="text" placeholder="Type your name">
      </label>

      <label>Email Address:
        <input type="email" placeholder="Your email here">
      </label>

      <label>Password:
        <input type="password" placeholder="Create password">
      </label>

      <label>Mobile Number:
        <input type="number" placeholder="01xxxxxxxxx">
      </label>

      <label class="check-row">
        <input type="checkbox">
        <span>I accept terms</span>
      </label>

      <label>Favorite Color:
        <input type="color">
      </label>

      <label>Date of Birth:
        <input type="date">
      </label>

      <label>Date & Time:
        <input type="datetime-local">
      </label>

      <label>Upload File:
        <input type="file">
      </label>

      <label>Select Month:
        <input type="month">
      </label>

      <fieldset class="radio-group">
        <legend>Gender:</legend>
        <label><input type="radio" name="gender"> Male</label>
        <label><input type="radio" name="gender"> Female</label>
      </fieldset>

      <label>Skill Level:
        <input type="range" min="0" max="10">
      </label>

      <label>Search:
        <input type="search" placeholder="Search...">
      </label>

      <label>Telephone:
        <input type="tel" placeholder="Enter phone number">
      </label>

      <label>Preferred Time:
        <input type="time">
      </label>

      <label>Website:
        <input type="url" placeholder="https://example.com">
      </label>

      <label>Select Week:
        <input type="week">
      </label>

      <div class="btn-row">
        <button type="submit" class="btn submit-btn">Register</button>
        <button type="reset" class="btn reset-btn">Clear</button>
      </div>
    </form>
  </section>

  <section class="container">
    <h2 class="title">Student Records</h2>

  </section>
</body>
</html>
